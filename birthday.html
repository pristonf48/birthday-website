<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

  :root{
    --bg-1:#120a1f;
    --bg-2:#1a0f2b;
    --bg-3:#05030a;
    --gold-1:#ffe9a8;
    --gold-2:#f4c14e;
    --gold-3:#c8860a;
    --pink:#ff8fab;
    --cream:#fdf3e3;
    --choc:#5a3420;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 50% 20%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-3) 100%);
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
    overflow-y:auto;
    width:100%;
    min-height:100vh;
  }

  .stage{
   position:relative;
    width:100%;
    min-height:100vh;
    max-width:900px;
    margin:0 auto;
    overflow:hidden;
  }

  /* ---------- ambient glow ---------- */
  .glow{
    position:absolute;
    left:50%; top:58%;
    width:70%; height:55%;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(244,193,78,0.16) 0%, rgba(244,193,78,0) 70%);
    pointer-events:none;
  }

  /* ---------- string lights ---------- */
  .lights{
    position:absolute; top:0; left:0; width:100%; height:120px;
    pointer-events:none;
  }
  .bulb{
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--gold-1);
    box-shadow:0 0 8px 3px rgba(255,220,140,0.9);
    animation:twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.35; transform:scale(0.8);}
    50%{opacity:1; transform:scale(1.15);}
  }

  /* ---------- confetti ---------- */
  .confetti{
    position:absolute; top:-20px;
    width:8px; height:14px;
    opacity:0.9;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-40px) rotate(0deg); }
    100%{ transform:translateY(110vh) rotate(540deg); }
  }

  /* ---------- balloons ---------- */
  .balloon-wrap{
    position:absolute;
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-18px) rotate(2deg); }
  }
  .balloon-string{
    position:absolute;
    left:50%;
    top:100%;
    width:1px;
    background:rgba(255,255,255,0.25);
    transform:translateX(-50%);
  }

  /* ---------- headline ---------- */
  .headline-wrap{
    position:absolute;
    top:5%;
    left:0; right:0;
    text-align:center;
    z-index:5;
  }
  .headline{
    font-family:'Great Vibes', cursive;
    font-size:clamp(56px, 11vw, 98px);
    line-height:0.95;
    margin:0;
    background:linear-gradient(180deg, #fff6d8 0%, var(--gold-2) 45%, var(--gold-3) 75%, var(--gold-2) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(244,193,78,0.55)) drop-shadow(0 2px 0 rgba(120,70,10,0.4));
    letter-spacing:1px;
  }
  .subtitle{
    margin-top:6px;
    color:#f5eee0;
    font-size:clamp(13px, 2vw, 17px);
    letter-spacing:0.5px;
    font-style:italic;
    text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:10px auto 4px;
  }
  .divider svg{ filter:drop-shadow(0 0 6px rgba(244,193,78,0.6)); }
  .heart-beat{
    animation:beat 1.6s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.18);}
  }

  /* ---------- cake ---------- */
  .cake-stage{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(-50%);
    width:min(56vw, 480px);
    z-index:4;
  }
  .flame{
    animation:flicker 1.1s ease-in-out infinite;
    transform-origin:center bottom;
  }
  .flame:nth-child(odd){ animation-duration:1.3s; }
  .flame:nth-child(3n){ animation-duration:0.9s; }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) scaleX(1) rotate(0deg); opacity:1; }
    30%{ transform:scaleY(1.12) scaleX(0.92) rotate(-2deg); opacity:0.92; }
    60%{ transform:scaleY(0.9) scaleX(1.05) rotate(2deg); opacity:1; }
  }

  /* ---------- gifts ---------- */
  .gift{ position:absolute; z-index:3; filter:drop-shadow(0 8px 14px rgba(0,0,0,0.5)); }
  .gift.left{ left:2%; bottom:8%; width:min(16vw,150px); }
  .gift.right{ right:3%; bottom:14%; width:min(13vw,120px); }

  /* ---------- flowers ---------- */
  .flowers{ position:absolute; right:1%; bottom:22%; width:min(20vw,190px); z-index:3;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,0.5)); }

  /* ---------- footer ---------- */
  .footer{
    position:absolute;
    bottom:3%;
    left:0; right:0;
    text-align:center;
    z-index:6;
  }
  .footer-text{
    font-family:'Great Vibes', cursive;
    font-size:clamp(22px, 4vw, 32px);
    color:#fdf3e3;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .music-btn{
    position:absolute;
    left:4%;
    bottom:4%;
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(10,8,18,0.7);
    border:1.5px solid var(--gold-2);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 10px rgba(244,193,78,0.45);
    z-index:6;
    animation:pulse-ring 2.6s ease-in-out infinite;
  }
  @keyframes pulse-ring{
    0%,100%{ box-shadow:0 0 8px rgba(244,193,78,0.35); }
    50%{ box-shadow:0 0 16px rgba(244,193,78,0.7); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="glow"></div>

  <!-- string lights -->
  <svg class="lights" viewBox="0 0 900 120" preserveAspectRatio="none">
    <path d="M -20 10 Q 225 90 450 20 T 920 15" fill="none" stroke="rgba(255,215,140,0.25)" stroke-width="1.5"/>
  </svg>
  <div id="bulbs"></div>

  <!-- confetti -->
  <div id="confettiLayer"></div>

  <!-- balloons -->
  <div class="balloon-wrap" style="left:2%; top:10%; animation-delay:0s;">
    <svg width="120" height="170" viewBox="0 0 120 170">
      <defs>
        <radialGradient id="purpleB" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#c9a8ff"/>
          <stop offset="55%" stop-color="#8f5fd1"/>
          <stop offset="100%" stop-color="#5c3a99"/>
        </radialGradient>
      </defs>
      <ellipse cx="60" cy="65" rx="52" ry="62" fill="url(#purpleB)"/>
      <path d="M60 127 L52 138 L68 138 Z" fill="#5c3a99"/>
      <line x1="60" y1="138" x2="60" y2="170" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    </svg>
  </div>

  <div class="balloon-wrap" style="left:10%; top:33%; animation-delay:1.4s;">
    <svg width="90" height="130" viewBox="0 0 90 130">
      <defs>
        <radialGradient id="goldB" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#fff0c0"/>
          <stop offset="55%" stop-color="#e0a83a"/>
          <stop offset="100%" stop-color="#a5720f"/>
        </radialGradient>
      </defs>
      <ellipse cx="45" cy="50" rx="40" ry="48" fill="url(#goldB)"/>
      <path d="M45 98 L38 107 L52 107 Z" fill="#a5720f"/>
      <line x1="45" y1="107" x2="45" y2="130" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    </svg>
  </div>

  <div class="balloon-wrap" style="right:3%; top:6%; animation-delay:0.6s;">
    <svg width="130" height="180" viewBox="0 0 130 180">
      <defs>
        <radialGradient id="amberB" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#ffe9b0"/>
          <stop offset="55%" stop-color="#e3a428"/>
          <stop offset="100%" stop-color="#a06e12"/>
        </radialGradient>
      </defs>
      <ellipse cx="65" cy="70" rx="56" ry="66" fill="url(#amberB)"/>
      <path d="M65 135 L56 147 L74 147 Z" fill="#a06e12"/>
      <line x1="65" y1="147" x2="65" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    </svg>
  </div>

  <div class="balloon-wrap" style="right:9%; top:32%; animation-delay:2s;">
    <svg width="95" height="135" viewBox="0 0 95 135">
      <defs>
        <radialGradient id="roseB" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#ffb9c9"/>
          <stop offset="55%" stop-color="#d1567a"/>
          <stop offset="100%" stop-color="#8c2f4d"/>
        </radialGradient>
      </defs>
      <ellipse cx="47" cy="52" rx="42" ry="50" fill="url(#roseB)"/>
      <path d="M47 102 L40 111 L54 111 Z" fill="#8c2f4d"/>
      <line x1="47" y1="111" x2="47" y2="135" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    </svg>
  </div>

  <!-- headline -->
  <div class="headline-wrap">
   <h1 class="headline" id="headline">Happy Birthday <span id="personName"></span></h1>
    <div class="divider">
      <svg width="26" height="10" viewBox="0 0 26 10"><path d="M0 5 Q13 -3 26 5" stroke="#f4c14e" stroke-width="1.2" fill="none"/></svg>
      <svg class="heart-beat" width="20" height="18" viewBox="0 0 20 18"><path d="M10 17 C-4 8 1 -2 10 4 C19 -2 24 8 10 17Z" fill="#ff6f91"/></svg>
      <svg width="26" height="10" viewBox="0 0 26 10"><path d="M26 5 Q13 -3 0 5" stroke="#f4c14e" stroke-width="1.2" fill="none"/></svg>
    </div>
    <div class="subtitle">Wishing you a day filled with joy, love and happiness!</div>
  </div>

  <!-- gift left -->
  <svg class="gift left" viewBox="0 0 140 130">
    <rect x="10" y="45" width="120" height="80" rx="4" fill="#f4ece0"/>
    <rect x="10" y="45" width="120" height="18" fill="#e9dcc6"/>
    <rect x="58" y="10" width="24" height="115" fill="#d7b98a"/>
    <path d="M70 10 C40 -10 30 20 55 28 C40 20 55 -5 70 10Z" fill="#d7b98a"/>
    <path d="M70 10 C100 -10 110 20 85 28 C100 20 85 -5 70 10Z" fill="#d7b98a"/>
  </svg>

  <!-- gift right -->
  <svg class="gift right" viewBox="0 0 120 110">
    <rect x="8" y="38" width="104" height="68" rx="4" fill="#7a2e57"/>
    <rect x="8" y="38" width="104" height="16" fill="#5e1f42"/>
    <rect x="50" y="8" width="20" height="98" fill="#e8b93a"/>
    <path d="M60 8 C34 -8 25 18 46 25 C34 18 46 -4 60 8Z" fill="#e8b93a"/>
    <path d="M60 8 C86 -8 95 18 74 25 C86 18 74 -4 60 8Z" fill="#e8b93a"/>
  </svg>

  <!-- flowers -->
  <svg class="flowers" viewBox="0 0 160 150">
    <g stroke="#3f6b3f" stroke-width="2" fill="none">
      <path d="M80 150 C75 110 90 90 70 60"/>
      <path d="M80 150 C85 115 75 95 100 65"/>
      <path d="M80 150 C80 120 80 100 80 55"/>
    </g>
    <g>
      <circle cx="70" cy="55" r="16" fill="#f2a6c4"/>
      <circle cx="100" cy="60" r="15" fill="#e8879f"/>
      <circle cx="80" cy="40" r="17" fill="#f6c1d4"/>
      <circle cx="55" cy="70" r="13" fill="#eb98b3"/>
      <circle cx="70" cy="55" r="7" fill="#fbdce8"/>
      <circle cx="100" cy="60" r="6" fill="#fbdce8"/>
      <circle cx="80" cy="40" r="7" fill="#fff0f4"/>
      <circle cx="55" cy="70" r="5" fill="#fbdce8"/>
    </g>
  </svg>

  <!-- cake -->
  <svg class="cake-stage" viewBox="0 0 400 380" id="cakeSvg">
    <!-- plate -->
    <ellipse cx="200" cy="355" rx="170" ry="18" fill="#d9d9d9"/>
    <ellipse cx="200" cy="349" rx="170" ry="16" fill="#f1f1f1"/>

    <!-- tier 3 (bottom) -->
    <g>
      <rect x="60" y="255" width="280" height="90" rx="6" fill="#fdf3e3"/>
      <rect x="60" y="255" width="280" height="90" rx="6" fill="url(#stripe)" opacity="0.25"/>
      <!-- drip -->
      <path d="M60 260 q10 22 20 4 q10 24 20 2 q10 26 20 3 q10 22 20 2 q10 24 20 3 q10 22 20 2 q10 24 20 3 q10 22 20 2 q10 24 20 3 q10 22 20 2 q10 24 20 3 q10 22 20 2 q10 24 20 3 L340 260 Z" fill="#6b3a1e"/>
      <!-- piping bottom -->
      <g fill="#8a5a34">
        <ellipse cx="80" cy="344" rx="12" ry="9"/><ellipse cx="105" cy="344" rx="12" ry="9"/><ellipse cx="130" cy="344" rx="12" ry="9"/>
        <ellipse cx="155" cy="344" rx="12" ry="9"/><ellipse cx="180" cy="344" rx="12" ry="9"/><ellipse cx="205" cy="344" rx="12" ry="9"/>
        <ellipse cx="230" cy="344" rx="12" ry="9"/><ellipse cx="255" cy="344" rx="12" ry="9"/><ellipse cx="280" cy="344" rx="12" ry="9"/>
        <ellipse cx="305" cy="344" rx="12" ry="9"/><ellipse cx="320" cy="344" rx="12" ry="9"/>
      </g>
    </g>

    <!-- tier 2 -->
    <g>
      <rect x="98" y="165" width="204" height="90" rx="6" fill="#f6c9d6"/>
      <path d="M98 170 q9 20 18 4 q9 22 18 2 q9 22 18 3 q9 20 18 2 q9 22 18 3 q9 20 18 2 q9 22 18 3 q9 20 18 2 q9 22 18 3 q9 20 18 2 L302 170 Z" fill="#6b3a1e"/>
      <g fill="#fdf3e3">
        <ellipse cx="118" cy="253" rx="11" ry="8"/><ellipse cx="142" cy="253" rx="11" ry="8"/><ellipse cx="166" cy="253" rx="11" ry="8"/>
        <ellipse cx="190" cy="253" rx="11" ry="8"/><ellipse cx="214" cy="253" rx="11" ry="8"/><ellipse cx="238" cy="253" rx="11" ry="8"/>
        <ellipse cx="262" cy="253" rx="11" ry="8"/><ellipse cx="282" cy="253" rx="11" ry="8"/>
      </g>
    </g>

    <!-- tier 1 (top) -->
    <g>
      <rect x="135" y="85" width="130" height="82" rx="6" fill="#fdf3e3"/>
      <path d="M135 90 q8 18 16 3 q8 20 16 2 q8 20 16 3 q8 18 16 2 q8 20 16 3 q8 18 16 2 L265 90 Z" fill="#6b3a1e"/>
      <g fill="#8a5a34">
        <ellipse cx="150" cy="90" rx="10" ry="7"/><ellipse cx="172" cy="90" rx="10" ry="7"/><ellipse cx="194" cy="90" rx="10" ry="7"/>
        <ellipse cx="216" cy="90" rx="10" ry="7"/><ellipse cx="238" cy="90" rx="10" ry="7"/><ellipse cx="255" cy="90" rx="10" ry="7"/>
      </g>
    </g>

    <!-- sprinkles -->
    <g>
      <rect x="90" y="290" width="4" height="10" rx="2" fill="#ffb84d" transform="rotate(20 90 290)"/>
      <rect x="260" y="300" width="4" height="10" rx="2" fill="#ff6f91" transform="rotate(-15 260 300)"/>
      <rect x="150" y="200" width="4" height="9" rx="2" fill="#7fd6ff" transform="rotate(30 150 200)"/>
      <rect x="220" y="210" width="4" height="9" rx="2" fill="#ffe066" transform="rotate(-25 220 210)"/>
      <rect x="180" y="120" width="3" height="8" rx="2" fill="#ff9ecf" transform="rotate(10 180 120)"/>
    </g>

    <!-- candles -->
    <g id="candles">
      <!-- 8 candles across the top -->
      <g transform="translate(150,85)">
        <rect x="-3" y="-38" width="6" height="38" fill="#ff9ecf"/>
        <rect x="-3" y="-38" width="6" height="6" fill="#fff"/>
        <path class="flame" d="M0 -46 C6 -40 6 -32 0 -28 C-6 -32 -6 -40 0 -46Z" fill="#ffb347"/>
        <path class="flame" d="M0 -43 C3 -39 3 -34 0 -31 C-3 -34 -3 -39 0 -43Z" fill="#fff3c4"/>
      </g>
      <g transform="translate(168,85)">
        <rect x="-3" y="-42" width="6" height="42" fill="#ffd85e"/>
        <path class="flame" d="M0 -50 C6 -44 6 -36 0 -32 C-6 -36 -6 -44 0 -50Z" fill="#ffb347"/>
        <path class="flame" d="M0 -47 C3 -43 3 -38 0 -35 C-3 -38 -3 -43 0 -47Z" fill="#fff3c4"/>
      </g>
      <g transform="translate(186,85)">
        <rect x="-3" y="-36" width="6" height="36" fill="#ff9ecf"/>
        <path class="flame" d="M0 -44 C6 -38 6 -30 0 -26 C-6 -30 -6 -38 0 -44Z" fill="#ffb347"/>
        <path class="flame" d="M0 -41 C3 -37 3 -32 0 -29 C-3 -32 -3 -37 0 -41Z" fill="#fff3c4"/>
      </g>
      <g transform="translate(204,85)">
        <rect x="-3" y="-46" width="6" height="46" fill="#ffd85e"/>
        <path class="flame" d="M0 -54 C6 -48 6 -40 0 -36 C-6 -40 -6 -48 0 -54Z" fill="#ffb347"/>
        <path class="flame" d="M0 -51 C3 -47 3 -42 0 -39 C-3 -42 -3 -47 0 -51Z" fill="#fff3c4"/>
      </g>
      <g transform="translate(222,85)">
        <rect x="-3" y="-38" width="6" height="38" fill="#ff9ecf"/>
        <path class="flame" d="M0 -46 C6 -40 6 -32 0 -28 C-6 -32 -6 -40 0 -46Z" fill="#ffb347"/>
        <path class="flame" d="M0 -43 C3 -39 3 -34 0 -31 C-3 -34 -3 -39 0 -43Z" fill="#fff3c4"/>
      </g>
      <g transform="translate(240,85)">
        <rect x="-3" y="-32" width="6" height="32" fill="#ffd85e"/>
        <path class="flame" d="M0 -40 C6 -34 6 -26 0 -22 C-6 -26 -6 -34 0 -40Z" fill="#ffb347"/>
        <path class="flame" d="M0 -37 C3 -33 3 -28 0 -25 C-3 -28 -3 -33 0 -37Z" fill="#fff3c4"/>
      </g>
      <g transform="translate(255,85)">
        <rect x="-3" y="-40" width="6" height="40" fill="#ff9ecf"/>
        <path class="flame" d="M0 -48 C6 -42 6 -34 0 -30 C-6 -34 -6 -42 0 -48Z" fill="#ffb347"/>
        <path class="flame" d="M0 -45 C3 -41 3 -36 0 -33 C-3 -36 -3 -41 0 -45Z" fill="#fff3c4"/>
      </g>
    </g>
  </svg>

  <!-- music button -->
  <div class="music-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--gold-2)"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </div>

  <!-- footer -->
  <div class="footer">
    <div class="footer-text" id="footerText">Today is all about you! <span style="color:#ff6f91;">&#10084;</span></div>
  </div>

</div>
<div>
    <!-- background song plays automatically -->
    <audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>
</div>
<script>
  // twinkling string-light bulbs along a gentle arc
  const bulbsLayer = document.getElementById('bulbs');
  const bulbCount = 26;
  for(let i=0;i<bulbCount;i++){
    const t = i/(bulbCount-1);
    const x = t*100;
    const y = 6 + Math.sin(t*Math.PI*1.4)*5 + (t>0.5? (t-0.5)*10 : 0);
    const b = document.createElement('div');
    b.className='bulb';
    b.style.left = x+'%';
    b.style.top = y+'%';
    b.style.animationDelay = (Math.random()*2.4)+'s';
    bulbsLayer.appendChild(b);
  }



  // confetti generator
  const confettiLayer = document.getElementById('confettiLayer');
  const colors = ['#f4c14e','#ff6f91','#7fd6ff','#ffe066','#c9a8ff','#ffffff'];
  const shapes = ['rect','circle'];
  for(let i=0;i<45;i++){
    const el = document.createElement('div');
    el.className='confetti';
    const color = colors[Math.floor(Math.random()*colors.length)];
    const shape = shapes[Math.floor(Math.random()*shapes.length)];
    el.style.background = color;
    el.style.left = (Math.random()*100)+'%';
    el.style.borderRadius = shape==='circle' ? '50%' : '2px';
    el.style.width = (5+Math.random()*5)+'px';
    el.style.height = (8+Math.random()*8)+'px';
    el.style.animationDuration = (6+Math.random()*7)+'s';
    el.style.animationDelay = (Math.random()*8)+'s';
    confettiLayer.appendChild(el);
  }

const name = localStorage.getItem("birthdayName") || "Friend";
const safeName = name
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

document.getElementById("headline").innerHTML =
`Happy Birthday<br>${safeName}`;

document.getElementById("footerText").innerHTML =
  `Today is all about you, ${safeName}! <span style="color:#ff6f91;">&#10084;</span>`;

document.title = `Happy Birthday ${safeName}`;

  const music = document.getElementById('bgMusic');
  music.volume = 0.8;
  music.play().catch(() => {
    // some browsers block autoplay with sound until the visitor
    // interacts with the page at least once — start it on that
    // first interaction instead, with no visible button needed
    const startOnFirstInteraction = () => {
      music.play();
      document.removeEventListener('click', startOnFirstInteraction);
      document.removeEventListener('keydown', startOnFirstInteraction);
      document.removeEventListener('touchstart', startOnFirstInteraction);
    };
    document.addEventListener('click', startOnFirstInteraction, { once:true });
    document.addEventListener('keydown', startOnFirstInteraction, { once:true });
    document.addEventListener('touchstart', startOnFirstInteraction, { once:true });
  });

</script>
</body>
</html>
